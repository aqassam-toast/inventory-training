<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toast Inventory — Internal Access</title>
  <link rel="stylesheet" href="assets/css/style.css?v=3" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fafafa;
    }
    .gate-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .gate-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .gate-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      text-decoration: none;
    }
    .gate-logo .logo-icon {
      background: var(--orange);
      color: white;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 800;
    }
    .gate-logo span {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--dark);
    }
    .gate-card h1 {
      font-size: 1.3rem;
      margin-bottom: 0.6rem;
    }
    .gate-card .subtitle {
      color: var(--mid);
      font-size: 0.925rem;
      margin-bottom: 1.5rem;
      line-height: 1.55;
    }
    .password-wrap {
      position: relative;
      margin-bottom: 0.75rem;
    }
    .password-wrap input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      color: var(--dark);
      letter-spacing: 0.05em;
    }
    .password-wrap input:focus { border-color: #aaa; }
    .password-wrap input.error { border-color: #e53e3e; }
    .error-msg {
      color: #e53e3e;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
      display: none;
    }
    .error-msg.visible { display: block; }
    .gate-card .btn-submit {
      width: 100%;
      background: var(--blue);
      color: white;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .gate-card .btn-submit:hover { opacity: 0.9; }
    .gate-card .public-link {
      display: block;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--mid);
      text-decoration: none;
    }
    .gate-card .public-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <div class="logo-icon">t</div>
    <span>Toast Inventory</span>
  </a>
</nav>

<div class="gate-wrap">
  <div class="gate-card">
    <a class="gate-logo" href="index.html">
      <div class="logo-icon">t</div>
      <span>Toast Inventory</span>
    </a>

    <h1>Internal access</h1>
    <p class="subtitle">
      This page is for the Toast Inventory team. Enter the internal password to continue.
    </p>

    <div class="password-wrap">
      <input type="password" id="password-input" placeholder="Enter internal password" />
    </div>
    <p class="error-msg" id="error-msg">Incorrect password. Please try again.</p>
    <button class="btn-submit" onclick="checkPassword()">Unlock</button>

    <a class="public-link" href="index.html">← Back to Training &amp; Support</a>
  </div>
</div>

<footer>
  Toast Inventory Training &amp; Support
</footer>

<script>
  const INTERNAL_HASH = "8dd40795099ef28537203f1668d2812d4357c9176fcd6345389f224e3ae390b1";
  const ADMIN_HASH    = "5ab59b0f23217a8b65039340ed2857430abf52f10ab4c34a94aac0ace660b161";
  const INTERNAL_KEY  = "ti_internal_auth";
  const ADMIN_KEY     = "ti_admin_auth";

  const REDIRECT_URL = new URLSearchParams(window.location.search).get('redirect') || 'index.html';

  // If internal view is already unlocked, go straight to the intended page
  if (localStorage.getItem(INTERNAL_KEY) === INTERNAL_HASH) {
    window.location.replace(REDIRECT_URL);
  }

  document.getElementById("password-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
  });

  async function checkPassword() {
    const val = document.getElementById("password-input").value;
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(val));
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");

    // INTERNAL_KEY goes in localStorage because that's where internal.js, internal-guard.js
    // and the tracker read it from; use "Exit internal view" in the banner to clear it.
    if (hash === ADMIN_HASH) {
      localStorage.setItem(INTERNAL_KEY, INTERNAL_HASH);
      localStorage.setItem(ADMIN_KEY, ADMIN_HASH);
      window.location.replace(REDIRECT_URL);
    } else if (hash === INTERNAL_HASH) {
      localStorage.setItem(INTERNAL_KEY, INTERNAL_HASH);
      localStorage.removeItem(ADMIN_KEY);
      window.location.replace(REDIRECT_URL);
    } else {
      document.getElementById("password-input").classList.add("error");
      document.getElementById("error-msg").classList.add("visible");
    }
  }
</script>

</body>
</html>
